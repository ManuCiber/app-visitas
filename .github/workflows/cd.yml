name: CD Pipeline

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-package:
    name: Build & Package Artifacts
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y empaquetar Backend (JAR)
        working-directory: ./backend
        run: |
          chmod +x mvnw || true
          mvn clean package -DskipTests

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar y compilar Frontend (Dist)
        working-directory: ./frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Subir artefacto Backend (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar-${{ github.ref_name }}
          path: backend/target/*.jar
          retention-days: 7

      - name: Subir artefacto Frontend (Build estático)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.ref_name }}
          path: frontend/dist/
          retention-days: 7
